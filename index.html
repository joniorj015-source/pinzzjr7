<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERTANYAAN DARI BAMA</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;}
body {background:linear-gradient(135deg,#1e1b4b,#312e81); color:#fff; min-height:100vh; padding:15px;}
.wadah {max-width:600px; margin:0 auto;}

/* ======================================
   TOMBOL ADMIN DIPASTIKAN BISA DIKLIK
   ====================================== */
.tombol-admin-pojok {
  position:fixed !important;
  top:10px !important;
  right:10px !important;
  z-index:999999999 !important;
  pointer-events:all !important;
  cursor:pointer !important;
}
.tombol-besar {
  padding:15px 25px !important;
  font-size:18px !important;
  font-weight:bold !important;
  background:linear-gradient(135deg,#ef4444,#b91c1c) !important;
  color:#fff !important;
  border:none !important;
  border-radius:12px !important;
  box-shadow:0 4px 15px rgba(0,0,0,0.4) !important;
  cursor:pointer !important;
  touch-action:manipulation !important;
}
.tombol-besar:active {transform:scale(0.95);}

.kartu {background:rgba(255,255,255,0.1); padding:22px; border-radius:18px; border:1px solid rgba(255,255,255,0.15); margin-bottom:15px;}
.judul {text-align:center; margin-bottom:20px; margin-top:70px;}
.sembunyi {display:none !important;}
.masukkan {width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.25); color:#fff; margin:8px 0; font-size:15px;}
.masukkan:focus {outline:none; border-color:#8b5cf6;}
label {display:block; margin-top:10px; margin-bottom:4px; font-size:14px; color:#ddd;}
.baris {display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.baris button {flex:1; min-width:100px;}
button {padding:10px 15px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:bold;}
.btn-hijau {background:#10b981; color:#fff;}
.btn-biru {background:#3b82f6; color:#fff;}
.btn-merah {background:#ef4444; color:#fff;}
.btn-abu {background:#4b5563; color:#fff;}
.daftar-item {padding:12px; background:rgba(0,0,0,0.2); border-radius:10px; margin:8px 0; border-left:3px solid #8b5cf6;}
.pilihan {display:block; width:100%; text-align:left; padding:12px; margin:6px 0; border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff; cursor:pointer;}
.pilihan.terpilih {background:rgba(139,92,246,0.4);}
textarea {min-height:80px; resize:vertical;}
.popup {position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; padding:15px; z-index:999999;}
.nav {display:flex; gap:6px; flex-wrap:wrap; margin-bottom:15px;}
.nav button {padding:8px 10px; font-size:13px;}
.nav .aktif {background:#8b5cf6;}
.judul-biasa {color:#a78bfa; margin:10px 0 5px;}
.judul-target {color:#34d399; margin:20px 0 5px;}
.link-khusus {background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.4); padding:8px; border-radius:8px; margin-top:8px; word-break:break-all; font-size:13px; color:#93c5fd;}
hr {border:0; border-top:1px solid rgba(255,255,255,0.2); margin:10px 0 15px;}
.pemutar-musik {background:rgba(236,72,153,0.12); border:2px solid rgba(236,72,153,0.5); padding:15px; border-radius:15px; margin-bottom:20px;}
.pemutar-musik h4 {color:#ec4899; margin-bottom:8px;}
audio {width:100%; margin-top:8px; border-radius:8px;}
</style>
</head>
<body>

<!-- ======================================
     TOMBOL ADMIN TERBESAR DI POJOK KANAN ATAS
     ====================================== -->
<div class="tombol-admin-pojok">
  <button class="tombol-besar" onclick="bukaLoginAdmin()">🔐 ADMIN</button>
</div>

<div class="wadah">

  <h1 class="judul">✨ PERTANYAAN DARI BAMA ✨</h1>

  <!-- 🎵 PEMUTAR MUSIK -->
  <div class="pemutar-musik" id="kotakMusik">
    <h4>🎵 Musik Latar</h4>
    <div id="infoMusik"><p style="color:#ddd; font-size:14px">Belum ada musik.</p></div>
    <audio id="pemutarAudio" controls loop style="display:none;">
    <div style="margin-top:8px;">
      <button class="btn-abu" onclick="putarMusik()">▶️ Putar</button>
      <button class="btn-abu" onclick="hentikanMusik()">⏹️ Stop</button>
    </div>
  </div>

  <!-- HALAMAN UTAMA -->
  <div id="halamanUtama">
    <h3 class="judul-biasa">📋 Pertanyaan Umum</h3>
    <div id="daftarBiasa"></div>

    <h3 class="judul-target">👤 Pertanyaan Khusus</h3>
    <div id="daftarTarget"></div>
  </div>

  <!-- HALAMAN JAWAB -->
  <div id="halamanJawab" class="sembunyi">
    <div class="kartu">
      <button class="btn-abu" onclick="kembaliUtama()" style="margin-bottom:15px">← Kembali</button>
      <h2 id="judulPertanyaan"></h2>
      <hr>
      <div id="isiPertanyaan"></div>
      <button class="btn-hijau" onclick="kirimJawaban()" style="width:100%; margin-top:15px">✅ KIRIM JAWABAN</button>
    </div>
  </div>

  <!-- POPUP LOGIN -->
  <div id="popupLogin" class="popup sembunyi">
    <div class="kartu" style="width:100%; max-width:400px;">
      <h2 style="text-align:center; margin-bottom:15px">🔐 Masuk Admin</h2>
      <input type="password" id="kataSandi" class="masukkan" placeholder="Masukkan kata sandi...">
      <div class="baris">
        <button class="btn-abu" onclick="tutupPopup()">Batal</button>
        <button class="btn-hijau" onclick="cekSandi()">MASUK</button>
      </div>
    </div>
  </div>

  <!-- HALAMAN ADMIN -->
  <div id="halamanAdmin" class="sembunyi">
    <div class="kartu">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2>⚙️ PANEL ADMIN</h2>
        <button class="btn-merah" onclick="keluarAdmin()">Keluar</button>
      </div>
      <div class="nav">
        <button class="aktif" id="tab1" onclick="bukaTab(1)">📩 Jawaban</button>
        <button id="tab2" onclick="bukaTab(2)">➕ Pertanyaan</button>
        <button id="tab3" onclick="bukaTab(3)">👤 Target</button>
        <button id="tab4" onclick="bukaTab(4)">🎵 Musik</button>
        <button id="tab5" onclick="bukaTab(5)">🔧 Sandi</button>
      </div>
      <hr>

      <div id="isiTab1">
        <h3>📩 Jawaban Masuk</h3>
        <p style="font-size:13px; color:#aaa; margin-bottom:10px">Jumlah: <span id="jumlahJawab">0</span></p>
        <div id="daftarJawab"></div>
      </div>

      <div id="isiTab2" class="sembunyi">
        <h3>➕ Tambah Pertanyaan Biasa</h3>
        <label>Judul:</label>
        <input type="text" class="masukkan" id="jbiasa" placeholder="Contoh: Pertanyaan Hari Ini">
        <label>Pertanyaan:</label>
        <textarea class="masukkan" id="ibiasa"></textarea>
        <button class="btn-hijau" onclick="simpanBiasa()" style="width:100%; margin-top:8px">✅ Simpan</button>
      </div>

      <div id="isiTab3" class="sembunyi">
        <h3>👤 Buat Target & Link</h3>
        <label>Nama:</label>
        <input type="text" class="masukkan" id="namaTarget" placeholder="Contoh: Dodol">
        <button class="btn-biru" onclick="tambahTarget()" style="width:100%; margin-top:8px; margin-bottom:15px">➕ Buat Link</button>
        <hr>
        <h4>🔗 Daftar Link:</h4>
        <div id="daftarLink"></div>
      </div>

      <div id="isiTab4" class="sembunyi">
        <h3>🎵 Upload Musik</h3>
        <label>Nama Lagu:</label>
        <input type="text" class="masukkan" id="namaLagu" placeholder="Contoh: Lagu Dodol">
        <label>Pilih File:</label>
        <input type="file" class="masukkan" id="fileMusik" accept="audio/*">
        <button class="btn-hijau" onclick="uploadMusik()" style="width:100%; margin-top:8px">✅ Pasang Musik</button>
      </div>

      <div id="isiTab5" class="sembunyi">
        <h3>🔧 Ubah Sandi</h3>
        <label>Sandi Baru:</label>
        <input type="text" class="masukkan" id="sandiBaru" value="admin123">
        <button class="btn-hijau" onclick="ubahSandi()" style="width:100%; margin-top:8px">✅ Simpan Sandi</button>
      </div>
    </div>
  </div>

</div>

<script>
const K_SANDI = "sandi_bama";
const K_DATA_BIAS = "data_biasa_bama";
const K_DATA_TARGET = "data_target_bama";
const K_MUSIK = "musik_bama";

let SANDI = "admin123";
let DATA_BIAS = [];
let DATA_TARGET = [];
let MUSIK_DATA = {nama:'', url:''};

function muat() {
  let s = localStorage.getItem(K_SANDI); if(s) SANDI = s;
  let db = localStorage.getItem(K_DATA_BIAS); if(db) DATA_BIAS = JSON.parse(db);
  let dt = localStorage.getItem(K_DATA_TARGET); if(dt) DATA_TARGET = JSON.parse(dt);
  let m = localStorage.getItem(K_MUSIK); if(m){MUSIK_DATA=JSON.parse(m); if(MUSIK_DATA.url) tampilkanMusik();}
  tampilkanHalamanUtama(); tampilkanLink();
}
function simpan(){
  localStorage.setItem(K_DATA_BIAS, JSON.stringify(DATA_BIAS));
  localStorage.setItem(K_DATA_TARGET, JSON.stringify(DATA_TARGET));
}

// === TOMBOL ADMIN — FUNGSI PALING PENTING ===
function bukaLoginAdmin(){
  document.getElementById("popupLogin").classList.remove("sembunyi");
  document.getElementById("kataSandi").value="";
}
function tutupPopup(){document.getElementById("popupLogin").classList.add("sembunyi");}
function cekSandi(){
  let k = document.getElementById("kataSandi").value.trim();
  if(k === SANDI){tutupPopup(); bukaAdmin();}
  else{alert("❌ Sandi SALAH!");}
}
function bukaAdmin(){
  document.getElementById("halamanUtama").classList.add("sembunyi");
  document.getElementById("halamanAdmin").classList.remove("sembunyi");
  bukaTab(1);
}
function keluarAdmin(){
  document.getElementById("halamanAdmin").classList.add("sembunyi");
  document.getElementById("halamanUtama").classList.remove("sembunyi");
}
function bukaTab(n){
  for(let i=1;i<=5;i++){
    document.getElementById("isiTab"+i).classList.add("sembunyi");
    document.getElementById("tab"+i).classList.remove("aktif");
  }
  document.getElementById("isiTab"+n).classList.remove("sembunyi");
  document.getElementById("tab"+n).classList.add("aktif");
}

function tampilkanHalamanUtama(){
  let hb="", ht="";
  DATA_BIAS.forEach((p,i)=>{hb+=`<div class="kartu"><h4>${p.judul}</h4><p>${p.teks}</p><button class="btn-biru" onclick="bukaBiasa(${i})">Jawab</button></div>`;});
  DATA_TARGET.forEach((t,i)=>{ht+=`<div class="kartu"><h4>${t.nama}</h4><button class="btn-hijau" onclick="bukaTarget(${i})">Jawab</button></div>`;});
  document.getElementById("daftarBiasa").innerHTML=hb;
  document.getElementById("daftarTarget").innerHTML=ht;
}
function simpanBiasa(){
  let judul=document.getElementById("jbiasa").value.trim();
  let teks=document.getElementById("ibiasa").value.trim();
  if(!judul||!teks){alert("Lengkapi isian!");return;}
  DATA_BIAS.push({judul,teks}); simpan(); tampilkanHalamanUtama();
  document.getElementById("jbiasa").value=""; document.getElementById("ibiasa").value="";
  alert("✅ Tersimpan!");
}
function tambahTarget(){
  let nama=document.getElementById("namaTarget").value.trim();
  if(!nama){alert("Isi nama!");return;}
  let pendek=nama.toLowerCase().replace(/[^a-z0-9]/g,"");
  DATA_TARGET.push({nama,pendek}); simpan(); tampilkanHalamanUtama(); tampilkanLink();
  document.getElementById("namaTarget").value="";
  alert(`✅ Link dibuat: ?untuk=${pendek}`);
}
function tampilkanLink(){
  let h=""; const url=window.location.origin+window.location.pathname;
  DATA_TARGET.forEach(t=>{h+=`<div class="link-khusus">${t.nama}: ${url}?untuk=${t.pendek}</div>`;});
  document.getElementById("daftarLink").innerHTML=h;
}
function bukaBiasa(i){
  document.getElementById("halamanUtama").classList.add("sembunyi");
  document.getElementById("halamanJawab").classList.remove("sembunyi");
  document.getElementById("judulPertanyaan").textContent=DATA_BIAS[i].judul;
  document.getElementById("isiPertanyaan").innerHTML=`<p>${DATA_BIAS[i].teks}</p><textarea class="masukkan" placeholder="Jawaban..."></textarea>`;
}
function bukaTarget(i){
  document.getElementById("halamanUtama").classList.add("sembunyi");
  document.getElementById("halamanJawab").classList.remove("sembunyi");
  document.getElementById("judulPertanyaan").textContent=DATA_TARGET[i].nama;
  document.getElementById("isiPertanyaan").innerHTML=`<p>Pertanyaan untuk ${DATA_TARGET[i].nama}</p><textarea class="masukkan" placeholder="Jawaban..."></textarea>`;
}
function kembaliUtama(){
  document.getElementById("halamanUtama").classList.remove("sembunyi");
  document.getElementById("halamanJawab").classList.add("sembunyi");
}
function kirimJawaban(){alert("✅ Terkirim!"); kembaliUtama();}

// === MUSIK ===
function tampilkanMusik(){
  document.getElementById("infoMusik").innerHTML=`<p>🎶 ${MUSIK_DATA.nama}</p>`;
  let a=document.getElementById("pemutarAudio"); a.style.display="block"; a.src=MUSIK_DATA.url;
}
function uploadMusik(){
  let n=document.getElementById("namaLagu").value.trim();
  let f=document.getElementById("fileMusik").files[0];
  if(!n||!f){alert("Lengkapi!");return;}
  let r=new FileReader(); r.onload=e=>{
    MUSIK_DATA={nama:n, url:e.target.result};
    localStorage.setItem(K_MUSIK, JSON.stringify(MUSIK_DATA));
    tampilkanMusik(); alert("✅ Musik terpasang!");
  }; r.readAsDataURL(f);
}
function putarMusik(){document.getElementById("pemutarAudio").play();}
function hentikanMusik(){document.getElementById("pemutarAudio").pause(); document.getElementById("pemutarAudio").currentTime=0;}

function ubahSandi(){
  let b=document.getElementById("sandiBaru").value.trim();
  if(!b){alert("Tidak boleh kosong!");return;}
  SANDI=b; localStorage.setItem(K_SANDI,SANDI); alert("✅ Sandi diganti!");
}

muat();
</script>

</div>
</body>
        </html>
