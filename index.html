<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17152b">
<title>WEBSITE KHUSUS PERTANYAN DARI BAMA</title>
<style>
:root{--bg:#0d0b18;--card:rgba(255,255,255,.08);--text:#fff;--muted:#b9b4d0;--primary:#7c3aed;--secondary:#2563eb;--border:rgba(255,255,255,.13);--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#251653 0,#0d0b18 48%,#080711 100%);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{max-width:1100px;margin:auto;padding:18px}.glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.22);border-radius:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--secondary));font-weight:900}.brand strong{display:block}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:11px 15px;border-radius:14px;color:#fff;background:rgba(255,255,255,.09);border:1px solid var(--border);transition:.2s}.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.14)}.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));border:0}.danger{background:#7f1d1d}.hero{padding:32px;text-align:center;margin-bottom:18px}.hero h1{font-size:clamp(28px,6vw,52px);margin:8px 0 12px}.hero p{color:var(--muted);max-width:700px;margin:0 auto 22px;line-height:1.6}.target-grid,.question-list,.stats{display:grid;gap:14px}.target-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.target-card{padding:20px;text-align:left;transition:.2s}.target-card:hover{transform:translateY(-3px)}.target-card h3{margin:8px 0}.target-card p{color:var(--muted);font-size:14px}.section{padding:22px;margin-bottom:18px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.question-card{padding:22px}.qmeta{color:var(--muted);font-size:13px;margin-bottom:8px}.question-card h2{margin:6px 0 18px;font-size:clamp(19px,4vw,28px)}.options{display:grid;gap:10px}.option{padding:15px;text-align:left;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid var(--border);color:#fff;transition:.2s}.option:hover,.option.selected{background:linear-gradient(135deg,rgba(124,58,237,.45),rgba(37,99,235,.35));border-color:rgba(255,255,255,.3);transform:translateY(-1px)}textarea,input,select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--border);background:rgba(0,0,0,.2);color:#fff;outline:none}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.progress{height:9px;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:.3s}.feedback{margin-top:15px;padding:14px;border-radius:14px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25)}.admin-shell{display:grid;grid-template-columns:210px 1fr;gap:15px}.sidebar{padding:14px;height:max-content;position:sticky;top:14px}.side-btn{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:transparent;color:#fff;margin:4px 0}.side-btn.active,.side-btn:hover{background:rgba(255,255,255,.1)}.admin-content{min-width:0}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:18px}.stat b{font-size:28px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.form-card{padding:18px;margin-top:12px}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17152b;border:1px solid var(--border);padding:12px 16px;border-radius:14px;z-index:50;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;color:var(--muted);padding:35px}.music{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px}.music input{width:100px}.footer{text-align:center;color:var(--muted);padding:25px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.09);font-size:12px}.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:700px){.admin-shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px}.side-btn{white-space:nowrap;width:auto}.row,.stats{grid-template-columns:1fr}.hero,.section{padding:18px}.topbar{align-items:flex-start}.brand small{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo" id="logo">BA</div><div><strong id="brandName">WEBSITE KHUSUS PERTANYAN DARI BAMA</strong><small>Platform pertanyaan interaktif</small></div></div>
  <div class="actions"><button class="btn" id="themeBtn">🌙</button><button class="btn" id="adminBtn">🔐 Admin</button></div>
</header>

<div id="publicView">
  <section class="hero glass fade" id="homeHero">
    <div class="pill">✨ Pertanyaan untuk kamu</div>
    <h1 id="publicTitle"></h1><p id="publicDesc"></p>
    <button class="btn primary" id="startBtn">Mulai Menjawab</button>
  </section>
  <section class="section glass" id="targetSection">
    <div class="section-title"><h2>Pilih Pertanyaan Untuk:</h2></div>
    <div class="target-grid" id="targetGrid"></div>
  </section>
  <section class="section glass hidden" id="quizView"></section>
  <div class="music glass" id="musicBar">
    <span>🎵 <b id="songName">Tidak ada lagu</b></span>
    <button class="btn" id="playBtn">▶️ Putar</button><button class="btn" id="pauseBtn">⏸️ Jeda</button>
    <label>🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".6"></label>
    <audio id="audio">
  </div>
  <footer class="footer" id="footer"></footer>
</div>

<div id="adminView" class="hidden">
  <div class="admin-shell">
    <aside class="sidebar glass">
      <button class="side-btn active" data-tab="dashboard">📊 Dashboard</button>
      <button class="side-btn" data-tab="targets">🎯 Target</button>
      <button class="side-btn" data-tab="questions">❓ Pertanyaan</button>
      <button class="side-btn" data-tab="appearance">🎨 Tampilan</button>
      <button class="side-btn" data-tab="messages">💬 Pesan</button>
      <button class="side-btn" data-tab="music">🎵 Musik</button>
      <button class="side-btn" data-tab="answers">📝 Jawaban</button>
      <button class="side-btn" data-tab="export">📦 Export</button>
      <button class="side-btn" data-tab="settings">⚙️ Pengaturan</button>
      <button class="side-btn" id="logoutBtn">🚪 Logout</button>
    </aside>
    <main class="admin-content" id="adminContent"></main>
  </div>
</div>
</div>

<div class="modal hidden" id="modal"><div class="modal-card glass" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

const ADMIN_PASSWORD = "admin123";

const KEY="bama_question_app_v1";
const DEFAULT_DATA={
 settings:{name:"WEBSITE KHUSUS PERTANYAN DARI BAMA",logo:"BA",title:"WEBSITE KHUSUS PERTANYAN DARI BAMA",description:"Jawab pertanyaan berikut dengan jujur dan santai. Pilih target untuk memulai.",button:"Mulai Menjawab",footer:"Dibuat dengan ❤️ oleh Bama",theme:"dark",primary:"#7c3aed",secondary:"#2563eb",finishedDefault:"🎉 Terima Kasih! Jawaban kamu sudah selesai. Terima kasih sudah meluangkan waktu 💙"},
 targets:[{id:"doli",name:"Doli",emoji:"💙",title:"Pertanyaan Khusus Untuk Doli 💙",description:"Doli, jawab pertanyaan berikut dengan jujur ya 😄",finished:"Terima kasih sudah menjawab semua pertanyaan, Doli 💙",questions:[
  {id:uid(),type:"abcd",required:true,text:"Menurut Doli, website ini bagaimana?",options:["Sangat bagus","Bagus","Biasa saja","Kurang bagus"],messages:["Wah, Doli memilih A 😄","Mantap, Doli memilih B 👍","Oke, Doli memilih C.","Terima kasih sudah menjawab 💙"],correct:"A",points:10},
  {id:uid(),type:"abcd",required:true,text:"Seberapa seru pertanyaan ini?",options:["⭐⭐⭐⭐⭐","⭐⭐⭐⭐","⭐⭐⭐","⭐⭐"],messages:["Wah, maksimal! 🔥","Seru juga! 😄","Oke, cukup seru 👍","Terima kasih sudah memberi nilai 💙"],correct:"A",points:10},
  {id:uid(),type:"text",required:true,text:"Tulis pesan untuk Bama.",options:[],messages:["Jawaban kamu sudah diterima 💙"],correct:"",points:10}
 ]}],
 submissions:[],temp:{},music:{name:"",data:"",volume:.6}
};

function uid(){return "q_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw){const d=clone(DEFAULT_DATA);saveData(d);return d}
  const d=JSON.parse(raw);
  d.settings={...DEFAULT_DATA.settings,...(d.settings||{})};
  d.targets=Array.isArray(d.targets)?d.targets:[];
  d.submissions=Array.isArray(d.submissions)?d.submissions:[];
  d.temp=d.temp||{}; d.music={...DEFAULT_DATA.music,...(d.music||{})};
  return d;
 }catch(e){console.error(e);toast("Data tersimpan tidak dapat dibaca.");return clone(DEFAULT_DATA)}
}
function saveData(d=data){
 try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){toast("Penyimpanan penuh. Musik mungkin terlalu besar.");return false}
}
let data=loadData(), admin=false, currentTab="dashboard", currentTarget=null, currentIndex=0, answers={}, submitted=false;

const $=s=>document.querySelector(s);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),2400)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function confirmAction(msg,fn){if(confirm(msg))fn()}
function targetById(id){return data.targets.find(t=>t.id===id)}
function baseUrl(){return location.href.split("?")[0].split("#")[0]}
function targetLink(t){return baseUrl()+"?target="+encodeURIComponent(t.id)}
function applySettings(){
 const s=data.settings; document.title=s.name;
 $("#brandName").textContent=s.name;$("#logo").textContent=s.logo||"BA";$("#publicTitle").textContent=s.title;$("#publicDesc").textContent=s.description;$("#startBtn").textContent=s.button;$("#footer").textContent=s.footer;
 document.documentElement.style.setProperty("--primary",s.primary);document.documentElement.style.setProperty("--secondary",s.secondary);
 document.body.classList.toggle("light",s.theme==="light");
 if(s.theme==="light"){document.body.style.background="#eef2ff";document.body.style.color="#111827"}else{document.body.style.background="radial-gradient(circle at top,#251653 0,#0d0b18 48%,#080711 100%)";document.body.style.color="#fff"}
 $("#volume").value=data.music.volume??.6; $("#audio").volume=data.music.volume??.6; $("#songName").textContent=data.music.name||"Tidak ada lagu";
 if(data.music.data)$("#audio").src=data.music.data;
}
function renderTargets(){
 const g=$("#targetGrid");
 if(!data.targets.length){g.innerHTML='<div class="empty">Belum ada target.</div>';return}
 g.innerHTML=data.targets.map(t=>`<div class="target-card glass fade"><div style="font-size:32px">${esc(t.emoji||"👤")}</div><h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><button class="btn primary" onclick="openTarget('${esc(t.id)}')">Buka Pertanyaan</button></div>`).join("");
}
function renderPublic(){
 applySettings();renderTargets();
 const id=new URLSearchParams(location.search).get("target");
 if(id){
  const t=targetById(id);
  if(t)openTarget(id);else{
   $("#targetSection").innerHTML='<div class="empty"><h2>❌ Pertanyaan untuk target ini tidak ditemukan.</h2><button class="btn" onclick="location.href=baseUrl()">← Kembali</button></div>';
  }
 }
}
function openTarget(id){
 const t=targetById(id);if(!t)return;
 currentTarget=t;currentIndex=0;submitted=false;
 const saved=data.temp[id];
 answers=saved&&saved.answers?clone(saved.answers):{};
 $("#homeHero").classList.add("hidden");$("#targetSection").classList.add("hidden");$("#quizView").classList.remove("hidden");
 renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function saveTemp(){if(!currentTarget)return;data.temp[currentTarget.id]={answers:clone(answers),index:currentIndex};saveData()}
function renderQuestion(){
 const v=$("#quizView"),t=currentTarget,q=t.questions[currentIndex],total=t.questions.length;
 if(!q){finishTarget();return}
 const pct=Math.round((currentIndex/total)*100),saved=answers[q.id];
 let body="";
 if(q.type==="abcd"||q.type==="emoji"||q.type==="choice"){
  body=`<div class="options">${q.options.map((o,i)=>`<button class="option ${saved===String.fromCharCode(65+i)?"selected":""}" onclick="choose('${q.id}','${String.fromCharCode(65+i)}')"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join("")}</div>`;
 }else if(q.type==="multi"){
  const arr=Array.isArray(saved)?saved:[];
  body=`<div class="options">${q.options.map((o,i)=>{let k=String.fromCharCode(65+i);return `<button class="option ${arr.includes(k)?"selected":""}" onclick="toggleMulti('${q.id}','${k}')">☑ ${esc(o)}</button>`}).join("")}</div><button class="btn primary" style="margin-top:12px" onclick="submitMulti('${q.id}')">Simpan Pilihan</button>`;
 }else if(q.type==="yesno"){
  body=`<div class="options"><button class="option ${saved==="A"?"selected":""}" onclick="choose('${q.id}','A')">✅ Ya</button><button class="option ${saved==="B"?"selected":""}" onclick="choose('${q.id}','B')">❌ Tidak</button></div>`;
 }else if(q.type==="rating"){
  body=`<div class="options">${[1,2,3,4,5].map(n=>`<button class="option ${saved===n?"selected":""}" onclick="chooseRating('${q.id}',${n})">${"⭐".repeat(n)} (${n})</button>`).join("")}</div>`;
 }else{
  body=`<textarea id="textAnswer" placeholder="Tulis jawaban kamu di sini...">${esc(saved||"")}</textarea><button class="btn primary" style="margin-top:12px" onclick="saveText('${q.id}')">Simpan Jawaban</button>`;
 }
 v.innerHTML=`<div class="question-card glass fade"><button class="btn" onclick="exitQuestions()">← Kembali</button><div style="margin:15px 0"><div class="qmeta">Pertanyaan ${currentIndex+1} dari ${total}</div><div class="progress"><i style="width:${pct}%"></i></div></div><h2>${esc(q.text)}</h2>${body}<div id="feedback"></div><div style="display:flex;justify-content:space-between;margin-top:18px;gap:8px"><button class="btn" onclick="prevQ()" ${currentIndex===0?"disabled":""}>← Sebelumnya</button><button class="btn primary" onclick="nextQ()">Berikutnya →</button></div></div>`;
}
function qMessage(q,key){if(q.type==="rating")return q.messages?.[key-1]||q.messages?.[0]||"";return q.messages?.[String(key).charCodeAt?String(key).charCodeAt(0)-65:0]||q.messages?.[0]||""}
function showFeedback(msg){$("#feedback").innerHTML=msg?`<div class="feedback">${esc(msg)}</div>`:""}
function choose(qid,key){const q=currentTarget.questions.find(x=>x.id===qid);answers[qid]=key;saveTemp();renderQuestion();showFeedback(qMessage(q,key))}
function chooseRating(qid,n){const q=currentTarget.questions.find(x=>x.id===qid);answers[qid]=n;saveTemp();renderQuestion();showFeedback(q.messages?.[n-1]||q.messages?.[0]||"Rating diterima ⭐")}
function toggleMulti(qid,key){let a=Array.isArray(answers[qid])?answers[qid]:[];a=a.includes(key)?a.filter(x=>x!==key):[...a,key];answers[qid]=a;saveTemp();renderQuestion()}
function submitMulti(qid){const q=currentTarget.questions.find(x=>x.id===qid);if(q.required&&(!answers[qid]||!answers[qid].length)){toast("Pilih minimal satu jawaban.");return}saveTemp();renderQuestion();showFeedback(q.messages?.[0]||"Pilihan diterima.")}
function saveText(qid){const v=$("#textAnswer").value.trim(),q=currentTarget.questions.find(x=>x.id===qid);if(q.required&&!v){toast("Jawaban wajib diisi.");return}answers[qid]=v;saveTemp();showFeedback(q.messages?.[0]||"Jawaban diterima.");}
function nextQ(){
 const q=currentTarget.questions[currentIndex],a=answers[q.id];
 if(q.required&&(a===undefined||a===""||(Array.isArray(a)&&!a.length))){toast("Pertanyaan ini wajib dijawab.");return}
 if(currentIndex<currentTarget.questions.length-1){currentIndex++;saveTemp();renderQuestion()}else finishTarget();
}
function prevQ(){if(currentIndex>0){currentIndex--;saveTemp();renderQuestion()}}
function exitQuestions(){$("#quizView").classList.add("hidden");$("#homeHero").classList.remove("hidden");$("#targetSection").classList.remove("hidden");currentTarget=null}
function finishTarget(){
 const t=currentTarget,score=calcScore(t,answers),sub={id:uid(),targetId:t.id,target:t.name,time:new Date().toISOString(),answers:clone(answers),score,total:totalPoints(t)};
 data.submissions.push(sub);delete data.temp[t.id];saveData();submitted=true;
 $("#quizView").innerHTML=`<div class="hero glass fade"><div style="font-size:60px">🎉</div><h1>Terima Kasih!</h1><p>${esc(t.finished||data.settings.finishedDefault)}</p>${score.total>0?`<h2>Skor kamu: ${score.earned}/${score.total}</h2>`:""}<button class="btn primary" onclick="exitQuestions()">Kembali ke Beranda</button></div>`;
}
function totalPoints(t){return t.questions.reduce((n,q)=>n+(q.points||0),0)}
function calcScore(t,ans){let earned=0;for(const q of t.questions){if(q.correct&&ans[q.id]===q.correct)earned+=q.points||0}return {earned,total:totalPoints(t)}}

function login(){
 modal(`<h2>🔐 Admin</h2><p>Masukkan password untuk mengakses panel admin.</p><input id="adminPass" type="password" autocomplete="current-password"><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="doLogin()">Masuk</button></div>`);
 setTimeout(()=>$("#adminPass")?.focus(),50)
}
function doLogin(){if($("#adminPass").value===ADMIN_PASSWORD){admin=true;closeModal();$("#publicView").classList.add("hidden");$("#adminView").classList.remove("hidden");renderAdmin()}else toast("Password salah.")}
function logout(){admin=false;$("#adminView").classList.add("hidden");$("#publicView").classList.remove("hidden");renderPublic()}
function modal(html){$("#modalCard").innerHTML=html;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
function renderAdmin(){
 const c=$("#adminContent");
 if(currentTab==="dashboard")c.innerHTML=dashboardHTML();
 if(currentTab==="targets")c.innerHTML=targetsHTML();
 if(currentTab==="questions")c.innerHTML=questionsHTML();
 if(currentTab==="appearance")c.innerHTML=appearanceHTML();
 if(currentTab==="messages")c.innerHTML=messagesHTML();
 if(currentTab==="music")c.innerHTML=musicHTML();
 if(currentTab==="answers")c.innerHTML=answersHTML();
 if(currentTab==="export")c.innerHTML=exportHTML();
 if(currentTab==="settings")c.innerHTML=settingsHTML();
 document.querySelectorAll(".side-btn[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
}

// ==============================================
// 🔄 FITUR CEK PEMBARUAN OTOMATIS
// ==============================================
let versiSekarang = localStorage.getItem('versi_web') || 'v1.0';

async function cekPembaruan() {
  try {
    let res = await fetch(window.location.href + '?t=' + Date.now(), { ca
